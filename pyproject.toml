[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptshield-lab"
version = "0.1.0"
description = "Auditable local evaluation harness for indirect prompt injection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PromptShield Research Team"}]
dependencies = [
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
openai = ["openai>=1.40,<3"]
dev = ["pytest>=8,<10"]

[project.scripts]
promptshield = "promptshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]